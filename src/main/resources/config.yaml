# ---------------- Model ----------------
model: claude-sonnet-5-5        # change to any model available on your account
max_tokens: 16000               # includes the model's thinking tokens, so keep this generous
use_web_search: true            # lets the qualitative analyst + skeptic search the web (Anthropic server tool)

skeptic_runs: 3                 # the skeptic runs this many times; the median severity decides (odd numbers work best)
anthropic_workspace_id: ""      # only for API keys not scoped to a workspace; env ANTHROPIC_WORKSPACE_ID wins

# ---------------- Watchlist ----------------
# Used by: java -jar stock-agent.jar --watchlist
# shares > 0 marks a position you hold: only those can get a SELL signal (others get BUY / WATCH / AVOID).
watchlist:
  - {ticker: NKE, shares: 0}
  - {ticker: TSLA, shares: 0}
  - {ticker: SPCX, shares: 0}

# ---------------- Monitoring ----------------
monitor:
  default_tier: auto            # used when --tier is not given: check | full | auto
  state_dir: work/state         # per-ticker memory (<TICKER>.json) and signals.csv
  # Triggers that make "auto" escalate from the cheap check to a full analysis:
  reanalyze_after_days: 30      # stored analysis is older than this
  price_move_trigger: 0.15      # price moved this much (either way) since the analysis
  trigger_forms: [10-K, 10-Q]   # a newer SEC filing of these forms exists (8-K can be added, but its text is not analysed)
  risk_profile: moderate        # your profile (see risk_profiles below): its BUY/SELL changes go to alerts.log
  # Signal rules (BUY uses the profile's margin_of_safety):
  sell_above_base: 0.10         # held position: SELL when price is this far above base value
  sell_on_thesis_break: true    # held position: SELL when the skeptic or a quality check fails
  hysteresis: 0.05              # once BUY/SELL is on, the price must move back this far past the line to turn it off
  confirm_runs: 2               # a changed signal must repeat on this many consecutive runs before it is alerted

# Run logs (console messages + full LLM prompts and replies), one file per run
log_dir: work/logs

# SEC requires a descriptive User-Agent with contact info
sec_user_agent: "YourName your.email@example.com"

# ---------------- Fetch limits ----------------
fetch:
  timeout_seconds: 25
  max_chars_per_doc: 500000     # text sent to the LLM per document; a full 10-K is ~400k chars (~100k tokens)
  user_agent: "Mozilla/5.0 (research-agent)"

# ---------------- Websites to research ----------------
# Add as many as you like. Placeholders:
#   {ticker}  full ticker as given (e.g. RELIANCE.NS, AAPL)
#   {symbol}  ticker without exchange suffix (e.g. RELIANCE, AAPL)
#   {company} company name from market data (URL-encoded)
# market: US | IN | ALL  -> which markets the source applies to
# type: page (HTML/PDF fetched directly)
sources:
  - name: Yahoo Finance - Analysis
    market: ALL
    url: "https://finance.yahoo.com/quote/{ticker}/analysis/"
  - name: Screener.in
    market: IN
    url: "https://www.screener.in/company/{symbol}/consolidated/"
  - name: Macrotrends - Revenue
    market: US
    enabled: false              # behind a Cloudflare browser challenge (HTTP 403 to any non-browser client)
    url: "https://www.macrotrends.net/stocks/charts/{symbol}/{symbol}/revenue"
  - name: Company investor relations (add yours)
    market: ALL
    enabled: false
    url: "https://example.com/investors"

# Extra direct document URLs per ticker (annual reports, transcripts, PDFs)
extra_documents:
  # RELIANCE.NS:
  #   - name: Annual Report FY25
  #     url: "https://.../annual-report.pdf"
  AAPL: []

# Web-search prompts used by the qualitative analyst / skeptic
search_queries:
  - "{company} earnings call highlights"
  - "{company} competitive advantage moat analysis"
  - "{company} management governance concerns"

# ---------------- Valuation ----------------
valuation:
  projection_years: 10
  # Scenario parameters. Base growth is blended with the Filings Analyst's estimate.
  scenarios:
    bear: {growth_offset: -0.04, discount_rate: 0.12, terminal_growth: 0.02}
    base: {growth_offset:  0.00, discount_rate: 0.10, terminal_growth: 0.03}
    bull: {growth_offset:  0.03, discount_rate: 0.09, terminal_growth: 0.035}
  growth_cap: 0.25              # max allowed first-stage growth
  growth_floor: -0.05
  growth_fade: true             # fade growth linearly toward terminal growth

# ---------------- Risk profiles: the decision rule (applied in code, not by the LLM) ----------------
# Every run decides once per profile, from the same analysis. monitor.risk_profile picks the one that raises alerts.
#   margin_of_safety           price must be at least this far below base intrinsic value
#   max_bear_downside          bear value must not be more than this far below the current price
#   max_debt_to_equity         as a ratio (1.5 = 150%)
#   min_roe                    minimum return on equity
#   min_fcf_conversion         minimum free cash flow / net income
#   block_on_skeptic_severity  minor = avoid on a minor or major skeptic rating; major = avoid on major only
risk_profiles:
  conservative:
    margin_of_safety: 0.35
    max_bear_downside: 0.30
    max_debt_to_equity: 1.0
    min_roe: 0.12
    min_fcf_conversion: 0.8
    block_on_skeptic_severity: minor
  moderate:
    margin_of_safety: 0.25
    max_bear_downside: 0.50
    max_debt_to_equity: 1.5
    min_roe: 0.10
    min_fcf_conversion: 0.6
    block_on_skeptic_severity: major
  aggressive:
    margin_of_safety: 0.10
    max_bear_downside: 0.70
    max_debt_to_equity: 2.5
    min_roe: 0.05
    min_fcf_conversion: 0.4
    block_on_skeptic_severity: major
